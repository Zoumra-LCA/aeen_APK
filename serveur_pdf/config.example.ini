[sftp]
host = SRVAPPSAEEN
port = 22
user = <identifiant FTP tablette>
password = <mot de passe FTP tablette>

[paths]
input_root = /aeen/a_traiter
output_root = /aeen/transfere

[mode]
; true = lire/écrire directement le système de fichiers local (si le dossier FTP
; est monté sur SRVAPPSAEEN). false = se connecter en SFTP.
; En mode local sous Windows, utiliser des chemins Windows pour input_root /
; output_root (ex. C:\aeen\ftp\a_traiter), pas des chemins /aeen/...
local = false
